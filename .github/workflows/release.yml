# ─────────────────────────────────────────────────────────────────────────────
#  UIIC Surveyor Automation — CI/CD Release Pipeline
# ─────────────────────────────────────────────────────────────────────────────
#  Triggers on every branch push and pull requests targeting main.
#  Steps:
#    1. Checkout code
#    2. Set up Python 3.10 (pinned for PaddlePaddle 2.x Windows stability)
#    3. Install all build dependencies (pinned from requirements-build.txt)
#    4. Download Playwright Chromium into build_assets/
#    5. Download PaddleOCR models into build_assets/
#    6. Stage bundled LibreOffice runtime for offline PDF generation
#    7. Extract version metadata
#    8. Verify import parity
#    9. Build the Windows EXE via PyInstaller (.spec file)
#    10. Verify and package the EXE
#    11. Upload ZIP as Build Artifact (available on all branches)
#    12. Create a GitHub Release and upload ZIP (main push only)
# ─────────────────────────────────────────────────────────────────────────────

name: Build & Release Windows EXE

on:
  push:
    branches:
      - '**'        # Run on every branch push
  pull_request:
    branches:
      - main        # Run on PRs targeting main
  workflow_dispatch:  # Allow manual trigger from Actions tab

# Cancel superseded runs on the same branch
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# ── Permissions for creating releases ──────────────────────────────────────
permissions:
  contents: write

env:
  APP_NAME: UIIC_Surveyor_Automation
  PYTHON_VERSION: "3.10"

jobs:
  build-and-release:
    name: Build EXE → Release
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      # ─── 1. Checkout ─────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0   # Full history for version tagging

      # ─── 2. Set up Python ────────────────────────────────────────────────
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # ─── 3. Cache pip packages ───────────────────────────────────────────
      - name: Cache pip packages
        uses: actions/cache@v5
        with:
          path: ~\AppData\Local\pip\Cache
          key: pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-${{ hashFiles('requirements-build.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-py${{ env.PYTHON_VERSION }}-

      # ─── 4. Install build dependencies ───────────────────────────────────
      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install -r requirements-build.txt

      # ─── 4b. Create placeholder settings.json files (gitignored) ─────────
      - name: Create CI settings.json files
        run: |
          function Ensure-Settings($real, $example) {
            if (-Not (Test-Path $real)) {
              if (Test-Path $example) {
                Copy-Item $example $real
                Write-Host "Created $real from $example"
              } else {
                Write-Host "WARNING: No example found for $real — build may warn"
              }
            } else {
              Write-Host "Found existing: $real"
            }
          }
          Ensure-Settings "app\config\settings.json"                    "app\config\settings.json.example"
          Ensure-Settings "app\portals\uiic\config\settings.json"       "app\portals\uiic\config\settings.json.example"
          Ensure-Settings "app\portals\newindia\config\settings.json"   "app\portals\newindia\config\settings.json.example"
          Ensure-Settings "app\portals\oic\config\settings.json"        "app\portals\oic\config\settings.json.example"
        shell: pwsh

      # ─── 5. Prepare Playwright Chromium ──────────────────────────────────
      - name: Download Playwright Chromium
        run: |
          New-Item -ItemType Directory -Force -Path "build_assets\ms-playwright" | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\build_assets\ms-playwright"
          python -m playwright install chromium
        shell: pwsh

      # ─── 6. Prepare PaddleOCR models ────────────────────────────────────
      - name: Download PaddleOCR models
        run: |
          New-Item -ItemType Directory -Force -Path "build_assets\paddleocr" | Out-Null
          $env:PADDLEOCR_HOME = "${{ github.workspace }}\build_assets\paddleocr"
          python -c "from paddleocr import PaddleOCR; PaddleOCR(use_angle_cls=True, lang='en', show_log=False); print('PaddleOCR models ready.')"
        shell: pwsh

      # ─── 6b. Stage LibreOffice runtime ───────────────────────────────────
      - name: Stage bundled LibreOffice runtime
        run: |
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $false

          choco install libreoffice-fresh -y --no-progress

          $candidates = @(
            "C:\Program Files\LibreOffice",
            "C:\Program Files (x86)\LibreOffice"
          )
          $source = $candidates | Where-Object { Test-Path "$_\program\soffice.exe" } | Select-Object -First 1
          if (-not $source) {
            Write-Error "LibreOffice install was not found after Chocolatey install."
            exit 1
          }

          $dest = "${{ github.workspace }}\build_assets\LibreOffice"

          # Hard-fail on removal so a partial prior run cannot silently persist.
          if (Test-Path $dest) {
            try {
              Remove-Item -Recurse -Force $dest -ErrorAction Stop
            } catch {
              Write-Error "Failed to remove prior LibreOffice staging at '$dest': $_"
              exit 1
            }
          }

          New-Item -ItemType Directory -Force -Path (Split-Path $dest) | Out-Null
          & robocopy $source $dest /MIR /NFL /NDL /NJH /NJS /NP
          $rc = $LASTEXITCODE
          if ($rc -gt 7) {
            Write-Error "robocopy failed while staging LibreOffice (exit $rc)."
            exit $rc
          }
          $LASTEXITCODE = 0

          if (-not (Test-Path "$dest\program\soffice.exe")) {
            Write-Error "Bundled LibreOffice staging failed: soffice.exe missing."
            exit 1
          }

          # Sanity guard: a valid LibreOffice install has hundreds of files.
          # Catches a robocopy run that exited 0 but produced a near-empty tree.
          $fileCount = (Get-ChildItem $dest -Recurse -File).Count
          if ($fileCount -lt 200) {
            Write-Error "Bundled LibreOffice appears incomplete: only $fileCount files staged (expected >= 200)."
            exit 1
          }

          $sizeMB = [math]::Round(((Get-ChildItem $dest -Recurse -File | Measure-Object Length -Sum).Sum / 1MB), 1)
          Write-Host "LibreOffice staged at $dest ($fileCount files, $sizeMB MB)"
        shell: pwsh

      # ─── 7. Extract version from pyproject.toml ─────────────────────────
      - name: Extract version
        id: version
        run: |
          $match = Select-String -Path pyproject.toml -Pattern '^\s*version\s*=\s*"([^"]+)"' | Select-Object -First 1
          $version = if ($match) { $match.Matches.Groups[1].Value } else { "0.0.0" }
          $timestamp = Get-Date -Format "yyyyMMdd-HHmmss"
          $short_sha = "${{ github.sha }}".Substring(0,7)
          $tag = "v${version}-build.${timestamp}"
          $zip_name = "${{ env.APP_NAME }}_v${version}_${short_sha}"

          echo "VERSION=$version"       >> $env:GITHUB_OUTPUT
          echo "TAG=$tag"               >> $env:GITHUB_OUTPUT
          echo "ZIP_NAME=$zip_name"     >> $env:GITHUB_OUTPUT
          echo "SHORT_SHA=$short_sha"   >> $env:GITHUB_OUTPUT
          echo "TIMESTAMP=$timestamp"   >> $env:GITHUB_OUTPUT

          Write-Host "Version: $version"
          Write-Host "Tag:     $tag"
          Write-Host "ZIP:     $zip_name"
        shell: pwsh

      # ─── 8. Verify OIC module imports (EXE vs local parity check) ───────
      - name: Verify OIC module imports (pre-build parity check)
        run: |
          Write-Host "Checking all OIC automation + data modules are importable..."
          $modules = @(
            "app.portals.oic.automation",
            "app.portals.oic.automation.login_module",
            "app.portals.oic.automation.navigation_module",
            "app.portals.oic.automation.assessment_of_loss_module",
            "app.portals.oic.automation.interim_report_module",
            "app.portals.oic.automation.date_formatter",
            "app.portals.oic.automation.document_upload_module",
            "app.portals.oic.automation.popup_service",
            "app.portals.oic.automation.ui_utils",
            "app.portals.oic.automation.workflow_module",
            "app.portals.oic.automation.basic_details_module",
            "app.portals.oic.automation.claim_search_module",
            "app.portals.oic.automation.selectors",
            "app.data",
            "app.data.oic_assessment_generator",
            "app.data.excel_parts_extractor",
            "app.data.excel_reader",
            "app.data.assessment_generator",
            "app.data.data_model",
            "app.data.folder_scanner",
            "app.data.printable_excel_service",
            "app.automation.services.cheque_ocr_adapter",
            "app.portals.newindia.automation.ocr_helper",
            "win32com.client",
            "pythoncom",
            "pywintypes",
            "win32print"
          )
          $failed = @()
          foreach ($mod in $modules) {
            $result = python -c "import $mod; print('OK: $mod')" 2>&1
            if ($LASTEXITCODE -ne 0) {
              Write-Host "  FAIL: $mod -- $result" -ForegroundColor Red
              $failed += $mod
            } else {
              Write-Host "  OK:   $mod"
            }
          }
          if ($failed.Count -gt 0) {
            Write-Error "OIC parity check FAILED — $($failed.Count) module(s) not importable:`n$($failed -join ', ')`nThese modules will cause ModuleNotFoundError in the EXE at runtime."
            exit 1
          }
          Write-Host "OIC parity check PASSED — all $($modules.Count) modules importable." -ForegroundColor Green
        shell: pwsh

      # ─── 9. Build EXE with PyInstaller ──────────────────────────────────
      - name: Build Windows EXE
        run: |
          $env:PLAYWRIGHT_BROWSERS_PATH = "${{ github.workspace }}\build_assets\ms-playwright"
          $env:PADDLEOCR_HOME            = "${{ github.workspace }}\build_assets\paddleocr"
          $env:PYTHONWARNINGS             = "ignore:The numpy.array_api submodule is still experimental.:UserWarning,ignore:invalid escape sequence.*:SyntaxWarning"

          Remove-Item -Recurse -Force build, dist -ErrorAction SilentlyContinue
          python -m PyInstaller --noconfirm --clean uiic_automation.spec
        shell: pwsh

      # ─── 9. Verify build output ─────────────────────────────────────────
      - name: Verify EXE was produced
        run: |
          $exe = "dist\${{ env.APP_NAME }}\${{ env.APP_NAME }}.exe"
          if (-Not (Test-Path $exe)) {
            Write-Error "Build FAILED — EXE not found at $exe"
            exit 1
          }
          $size = (Get-Item $exe).Length / 1MB
          Write-Host "EXE verified: $exe ($([math]::Round($size,1)) MB)"

          # List top-level dist contents for debugging
          Write-Host "`n=== dist/${{ env.APP_NAME }}/ contents ==="
          Get-ChildItem "dist\${{ env.APP_NAME }}" | Select-Object Name, Length | Format-Table -AutoSize
          Write-Host "`n=== bundled LibreOffice check ==="
          if (-Not (Test-Path "dist\${{ env.APP_NAME }}\_internal\LibreOffice\program\soffice.exe")) {
            Write-Error "Bundled LibreOffice missing from dist."
            exit 1
          }
          Write-Host "Bundled LibreOffice found."
        shell: pwsh

      # ─── 10. Verify packaged runtime resources ──────────────────────────
      - name: Verify packaged runtime resources
        run: |
          python scripts\verify_packaged_runtime.py "dist\${{ env.APP_NAME }}"
        shell: pwsh

      # ─── 11. Smoke-test the EXE (headless) ──────────────────────────────
      - name: Smoke-test EXE (launch + exit)
        run: |
          Write-Host "Attempting headless smoke-test of the EXE..."
          $exe = "dist\${{ env.APP_NAME }}\${{ env.APP_NAME }}.exe"

          # The app is a GUI (PyQt6) so we can only verify it starts without crashing.
          # We launch it, wait briefly, then kill it. Non-zero exit = crash.
          $proc = Start-Process -FilePath $exe -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 8

          if ($proc.HasExited) {
            if ($proc.ExitCode -ne 0) {
              Write-Error "EXE crashed on launch with exit code $($proc.ExitCode)"
              exit 1
            }
            Write-Host "EXE exited cleanly (exit code 0) — possibly no display available."
          } else {
            Write-Host "EXE is running after 8 seconds — no crash detected."
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }
          Write-Host "Smoke-test PASSED"
        shell: pwsh
        continue-on-error: true   # GUI may fail without a display; treated as non-fatal

      # ─── 12. Create ZIP archive ─────────────────────────────────────────
      - name: Package release ZIP
        run: |
          $source  = "dist\${{ env.APP_NAME }}"
          $zipFile = "${{ steps.version.outputs.ZIP_NAME }}.zip"

          Write-Host "Creating $zipFile from $source ..."
          Compress-Archive -Path "$source\*" -DestinationPath $zipFile -CompressionLevel Optimal -Force

          $sizeMB = [math]::Round((Get-Item $zipFile).Length / 1MB, 1)
          Write-Host "ZIP created: $zipFile ($sizeMB MB)"

          echo "ZIP_PATH=$zipFile" >> $env:GITHUB_OUTPUT
        id: zip
        shell: pwsh

      # ─── 12.5. Upload Artifact (For All Branches) ───────────────────────
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.ZIP_NAME }}
          path: ${{ steps.version.outputs.ZIP_NAME }}.zip
          retention-days: 14

      # ─── 13. Create GitHub Release (Only for Main Branch Push) ──────────
      - name: Create GitHub Release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.TAG }}
          name: "${{ env.APP_NAME }} ${{ steps.version.outputs.VERSION }} (build ${{ steps.version.outputs.SHORT_SHA }})"
          body: |
            ## 🚀 Automated Release

            **Version:** `${{ steps.version.outputs.VERSION }}`
            **Commit:** [`${{ steps.version.outputs.SHORT_SHA }}`](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }})
            **Built:** ${{ steps.version.outputs.TIMESTAMP }} UTC
            **Python:** ${{ env.PYTHON_VERSION }}
            **Runner:** `windows-latest`

            ### 📦 Installation
            1. Download the `.zip` file below
            2. Extract to any folder
            3. Run `${{ env.APP_NAME }}.exe`

            ### ⚠️ Notes
            - Windows Defender may briefly scan on first launch — this is normal
            - The `_internal/` folder must stay alongside the EXE
            - Built from pinned dependencies (`requirements-build.txt`) for reproducibility

            ---
            *This release was created automatically by GitHub Actions.*
          files: ${{ steps.version.outputs.ZIP_NAME }}.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
