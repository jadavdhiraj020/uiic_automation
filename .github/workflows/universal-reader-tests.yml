name: Universal Report Reader Tests

on:
  push:
    branches:
      - feature/universal-report-reader-v1
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reader-tests:
    name: PDF/Excel reader unit tests
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install test dependency
        run: python -m pip install --upgrade pytest pdfplumber

      - name: Run universal report reader tests
        run: python -m pytest tests/test_pdf_report_reader.py -v
